name: Deploy to Snowflake

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
      
  # 🌟 THIS MUST BE PRESENT 🌟
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This step installs schemachange and runs the deployment
      - name: Run schemachange Deployment
        env:
          # Define all secrets as environment variables (THIS BLOCK REMAINS THE SAME)
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USERNAME: ${{ secrets.SF_USER }} 
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }} 
        
        run: |
          # Step 1: Install schemachange via pip
          pip install schemachange
          
          # Step 2: Run schemachange, looking in the 'deploy' folder
          # 🌟 FIX APPLIED: REMOVING the unsupported '--password' flag. 🌟
          schemachange -f deploy deploy \
                       -a "$SF_ACCOUNT" \
                       -u "$SF_USERNAME" \
                       -r "$SF_ROLE" \
                       -w "$SF_WAREHOUSE" \
                       -d "$SF_DATABASE"
